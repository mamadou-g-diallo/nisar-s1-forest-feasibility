[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nisar_s1"
version = "0.2.0"
description = "L-band (NISAR, future ROSE-L) versus C-band (Sentinel-1) SAR tools for forest change and forested-slope analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mamadou Galy Diallo" }]
keywords = ["NISAR", "Sentinel-1", "SAR", "InSAR", "coherence", "forest", "clear-cut", "ROSE-L", "ISCE3"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "h5py>=3.8",
    "fsspec>=2023.1",
    "affine>=2.4",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "asf_search>=8.0",
    "earthaccess>=0.9",
    "pystac-client>=0.7",
    "matplotlib>=3.7",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/mamadou-g-diallo/nisar-s1-forest-feasibility"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nisar_s1 = ["graphs/*.xml"]
