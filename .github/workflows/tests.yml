name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package from scratch (with its declared dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run the tests from outside the repository
        run: |
          cd "$RUNNER_TEMP"
          python -c "import nisar_s1; print(nisar_s1.__version__, nisar_s1.__file__)"
          pytest -q "$GITHUB_WORKSPACE/tests" -p no:cacheprovider
