name: tests

on:
  push:
    branches: [main]
  pull_request:

# The processing code and its unit tests live in https://github.com/mamadou-g-diallo/nisar-s1.
# Here we check that the pinned release installs and provides every name the study uses.
jobs:
  study-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install the pinned nisar_s1 release
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check the imports of the scripts and notebooks
        run: python tools/check_imports.py
      - name: Byte-compile the scripts
        run: python -m compileall -q vosges/scripts morvan/scripts sechilienne/scripts training/scripts tools
