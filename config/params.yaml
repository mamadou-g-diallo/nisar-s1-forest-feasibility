# Paramètres du test de faisabilité NISAR vs Sentinel-1 (pas de secrets ici).
# Les valeurs marquées "a_affiner" seront précisées aux étapes 2-3.

projet:
  nom: nisar-s1-forest-france
  crs_travail: EPSG:32632          # UTM 32N (Vosges / Alsace)

chemins:
  data_root: /media/dell/Transcend1/nisar_data
  raw: /media/dell/Transcend1/nisar_data/raw
  processed: /media/dell/Transcend1/nisar_data/processed
  gpt: ~/esa-snap/bin/gpt

# Emprise de recherche (étape 2). Massif vosgien + piémont alsacien, en WGS84.
aoi_recherche:
  nom: vosges_alsace
  bbox_wgs84: [6.70, 47.70, 7.70, 48.80]   # [lon_min, lat_min, lon_max, lat_max] — a_affiner

periode:
  debut: 2026-06-01
  fin: 2026-11-30

capteurs:
  sentinel1:
    plateforme: [S1A, S1C, S1D]
    orbites_prioritaires: [139, 88]   # D139 couvre 100 %, A88 92 %
    mode: IW
    produit: SLC
    polarisations: [VV, VH]
    bursts_max: 3                  # contrainte RAM (~8 Go)
  nisar:
    bande: L
    produits: [GUNW, GCOV]         # L2 ; noms exacts des collections a_affiner (étape 2)
    polarisations_cibles: [HH, HV]
    geometries_prioritaires:      # issu de l'inventaire (étape 2)
      - {direction: A, track: 144, frame: 26}
      - {direction: D, track: 138, frame: 64}
      - {direction: A, track: 72, frame: 26}
    mode_cible: "2005"             # 20+5 MHz, HH/HV -> GCOV et cohérence GUNW à 20 m
  biomass:
    bande: P
    disponible: false             # zone d'exclusion SOTR (Europe, Amérique du Nord)
  sentinel2:
    produit: L2A
    nuages_max_pct: 20

comparaison:
  grille_m: 20
  intervalle_coherence_jours: 12   # même intervalle temporel pour S1 et NISAR
  surface_coupe_min_ha: 2   # 20 m grid: >= 50 pixels; no clean >= 5 ha summer cut found in the AOI
  buffer_interieur_m: 20           # érosion des polygones (un pixel radar) — a_affiner
  seuil_dndvi: -0.2                # à calibrer à l'étape 3
  metriques: [delta_moyen, cohen_d, auc, jeffries_matusita, f1_detection]
